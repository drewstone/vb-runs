[profile.default]
src = "src/contracts"
out = "out"
libs = ["node_modules"]
solc_version = "0.8.26"
evm_version = "cancun"
via_ir = true

# ── Remappings ──────────────────────────────────────────────────────────
# Map V4 dependency paths used by @uniswap/v4-periphery's BaseHook.
remappings = [
    "@uniswap/v4-core/=node_modules/@uniswap/v4-core/",
    "@uniswap/v4-periphery/=node_modules/@uniswap/v4-periphery/",
]

# ── Gas / runs ──────────────────────────────────────────────────────────
optimizer = true
optimizer_runs = 1_000_000

# ── Build info ──────────────────────────────────────────────────────────
extra_output = ["storageLayout", "metadata"]
